# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(parquet|png|jpg|svg)$
      - id: end-of-file-fixer
        exclude: \.(parquet|png|jpg|svg)$
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, html, css, javascript, ts, json, yaml]
        exclude: >-
          (?x)^(
            node_modules/|
            dist/|
            observable/src/\.observablehq/|
            dataset/|
            downloaded/
          )

  # Hooks système — exécutés uniquement en local (non disponibles dans Docker)
  - repo: local
    hooks:
      - id: nixpkgs-fmt
        name: nixpkgs-fmt
        description: Format nix code with nixpkgs-fmt.
        language: system
        entry: nixpkgs-fmt
        files: \.nix$
        stages: [pre-commit]
      - id: deno-fmt
        name: deno-fmt
        description: Format deno code with deno fmt.
        language: system
        entry: deno fmt
        stages: [pre-commit]
        files: \.ts$
      - id: deno-lint
        name: deno-lint
        description: Lint deno code with deno lint.
        language: system
        entry: deno lint
        stages: [pre-commit]
        files: \.ts$
