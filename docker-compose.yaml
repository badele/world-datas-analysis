services:
  psql:
    container_name: psql
    image: docker.io/chumaky/postgres_duckdb_fdw:16.3_fdw1.0.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: wda
      POSTGRES_USER: wda
      POSTGRES_PASSWORD: wda
    networks:
      - wda
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dataset:/dataset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wda -d wda"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    networks:
      - wda
    ports:
      - "9600:80"
    environment:
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    entrypoint: /bin/sh -c "chmod 600 /pgpass; /entrypoint.sh;"
    user: root
    configs:
      - source: servers.json
        target: /pgadmin4/servers.json
      - source: pgpass
        target: /pgpass

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    user: "472"
    networks:
      - wda
    ports:
      - "9300:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - $PWD/db:/db
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource 3.5.0
    depends_on:
      - psql

  observable-dev:
    image: docker.io/library/node:22-slim
    container_name: observable-dev
    restart: unless-stopped
    networks:
      - wda
    ports:
      - "9400:3000"
    working_dir: /app
    volumes:
      - ./observable:/app
      - observable-dev-modules:/app/node_modules
    environment:
      PGHOST: psql
      PGPORT: 5432
      PGDATABASE: wda
      PGUSER: wda
      PGPASSWORD: wda
    command:
      - /bin/sh
      - -ec
      - |
        npm ci
        npm run dev
    depends_on:
      psql:
        condition: service_healthy

  observable:
    image: docker.io/library/nginx:1.27-alpine
    container_name: observable
    restart: unless-stopped
    networks:
      - wda
    ports:
      - "9500:80"
    volumes:
      - observable-dist:/usr/share/nginx/html:ro
      - ./observable/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      observable-build:
        condition: service_completed_successfully

  observable-build:
    image: docker.io/library/node:22-slim
    container_name: observable-build
    restart: "no"
    networks:
      - wda
    working_dir: /app
    volumes:
      - ./observable:/app
      - observable-build-modules:/app/node_modules
      - observable-dist:/output
    environment:
      PGHOST: psql
      PGPORT: 5432
      PGDATABASE: wda
      PGUSER: wda
      PGPASSWORD: wda
    command:
      - /bin/sh
      - -ec
      - |
        npm ci
        npm run build -- --debug
        rm -rf /output/*
        cp -a dist/. /output/
    depends_on:
      psql:
        condition: service_healthy

  precommit:
    build:
      context: .
      target: precommit
    volumes:
      - .:/app
      - precommit_cache:/root/.cache
    environment:
      SKIP: nixpkgs-fmt,deno-fmt,deno-lint

configs:
  pgpass:
    content: psql:5432:*:wda:wda
  servers.json:
    content: |
      {"Servers": {"1": {
        "Group": "Servers",
        "Name": "wda",
        "Host": "psql",
        "Port": 5432,
        "MaintenanceDB": "postgres",
        "Username": "wda",
        "PassFile": "/pgpass",
        "SSLMode": "prefer"
      }}}

networks:
  wda:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  pgadmin-data:
  observable-dist:
  observable-dev-modules:
  observable-build-modules:
  precommit_cache:
